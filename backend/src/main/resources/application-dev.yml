spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/heizoel_backend}
    username: ${DB_USERNAME:heizoel}
    password: ${DB_PASSWORD:heizoel}
    driver-class-name: org.postgresql.Driver

  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/dev
    placeholders:
      devSmtpHost: ${DEV_SMTP_HOST:localhost}
      devDispoCallbackUrl: ${DEV_DISPO_CALLBACK_URL:http://localhost:8090/api/dispo/confirmation-status-updates}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  servlet:
    session:
      cookie:
        secure: false

heizoel:
  confirmation:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    dispo-tracking-url: ${DISPO_TRACKING_URL:http://localhost:8090/api/dispo/confirmation-status-updates/tracking/orders}

  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    sms-from: ${TWILIO_SMS_FROM:}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
    content-template-sid: ${TWILIO_CONTENT_TEMPLATE_SID:}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace