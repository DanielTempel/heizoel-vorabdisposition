spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/heizoel_backend
    username: heizoel
    password: heizoel
    driver-class-name: org.postgresql.Driver

  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/dev


server:
  servlet:
    session:
      cookie:
        secure: false

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

heizoel:
  confirmation:
    frontend-url: http://localhost:3000
    dispo-tracking-url: http://localhost:8090/api/dispo/confirmation-status-updates/tracking/orders
    sms-provider-url: http://localhost:8091/api/sms/messages
    whatsapp-provider-url: http://localhost:8092/api/whatsapp/messages

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
