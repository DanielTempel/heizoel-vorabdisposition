spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/heizoel_backend
    username: heizoel
    password: heizoel
    driver-class-name: org.postgresql.Driver

  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

heizoel:
  confirmation:
    frontend-url: http://localhost:3000
    dispo-tracking-url: http://localhost:8090/api/dispo/confirmation-status-updates/tracking/orders

  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    sms-from: ${TWILIO_SMS_FROM:}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
    content-template-sid: ${TWILIO_CONTENT_TEMPLATE_SID:}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
