spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/heizoel_backend}
    username: ${DB_USERNAME:heizoel}
    password: ${DB_PASSWORD:heizoel}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

heizoel:
  confirmation:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}

  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    sms-from: ${TWILIO_SMS_FROM:}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
    content-template-sid: ${TWILIO_CONTENT_TEMPLATE_SID:}

  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME}}

logging:
  level:
    root: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
