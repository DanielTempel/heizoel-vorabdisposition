spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/heizoel_backend}
    username: ${DB_USERNAME:heizoel}
    password: ${DB_PASSWORD:heizoel}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

heizoel:
  confirmation:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    dispo-url: ${DISPO_CALLBACK_URL:http://localhost:8090/api/dispo/confirmation-status-updates}
    sms-provider-url: ${SMS_PROVIDER_URL}
    whatsapp-provider-url: ${WHATSAPP_PROVIDER_URL}

  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME}}

logging:
  level:
    root: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
