spring:
  application:
    name: heizoel-backend

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

camunda:
  bpm:
    auto-deployment-enabled: true
    deployment-resource-pattern:
      - classpath*:processes/*.bpmn

heizoel:
  confirmation:
    frontend-url: http://localhost:3000
    dispo-url: http://localhost:8090/api/dispo/confirmation-status-updates
    dispo-tracking-url: http://localhost:8090/api/dispo/confirmation-status-updates/tracking/orders
    sms-provider-url: http://localhost:8091/api/sms/messages
    whatsapp-provider-url: http://localhost:8092/api/whatsapp/messages

  location:
    geocoding:
      enabled: true
      provider: nominatim
      base-url: https://nominatim.openstreetmap.org
      search-path: /search
      user-agent: heizoel-vorabdisposition/1.0
      country-code: de
      accept-language: de,en
      result-limit: 1
      cache-ttl-minutes: 60

  mail:
    from: no-reply@heizoel.local

logging:
  level:
    root: info
