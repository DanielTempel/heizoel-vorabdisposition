spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: heizoel-backend

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

camunda:
  bpm:
    auto-deployment-enabled: true
    deployment-resource-pattern:
      - classpath*:processes/*.bpmn

heizoel:
  confirmation:
    frontend-url: http://localhost:3000
    dispo-tracking-url: http://localhost:8090/api/dispo/confirmation-status-updates/tracking/orders

  twilio:
    account-sid:
    auth-token:
    sms-from:
    whatsapp-from:
    content-template-sid:

  location:
    geocoding:
      enabled: true
      provider: nominatim
      base-url: https://nominatim.openstreetmap.org
      search-path: /search
      user-agent: heizoel-vorabdisposition/1.0
      country-code: de
      accept-language: de,en
      result-limit: 1
      cache-ttl-minutes: 60

  security:
    secret-encryption:
      master-key: ${SECRET_ENCRYPTION_MASTER_KEY}

logging:
  level:
    root: info
