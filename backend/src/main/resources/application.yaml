spring:
  application:
    name: heizoel-backend

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

camunda:
  bpm:
    auto-deployment-enabled: true
    deployment-resource-pattern:
      - classpath*:processes/*.bpmn

heizoel:
  confirmation:
    response-deadline: PT24H
    frontend-url: http://localhost:3000
    dispo-url: http://localhost:8090/api/dispo/confirmation-status-updates
    sms-provider-url: http://localhost:8091/api/sms/messages

  mail:
    from: no-reply@heizoel.local

logging:
  level:
    root: info